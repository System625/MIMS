<!--
  Favicon: mark 2B ("shut line"), the 16px optical variant from the canvas —
  widened gap, raised lower panel, because the display geometry's 6-unit gap
  closes up when rasterised this small.

  Given its own ink ground rather than left transparent: a tab strip may be
  light or dark, and ink-on-transparent disappears against a dark one. Ink is
  already the brand ground here — it matches the app header and the themeColor
  in layout.tsx.
-->
